<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Activation</title>
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background-color: #fff9e6;
        margin: 0;
        padding: 0;
        color: #3c4b64;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .header {
        font-size: 24px;
        font-weight: bold;
        color: #0864cc;
      }
      .title {
        font-size: 20px;
        color: #f4a900;
      }
      .message {
        font-size: 16px;
        margin-top: 15px;
      }
      .cta-button {
        display: inline-block;
        padding: 10px 20px;
        background-color: #0864cc;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        margin-top: 20px;
        font-size: 16px;
      }
      .footer {
        font-size: 14px;
        color: #f4a900;
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">Dear {{ title }} {{ last_name }},</div>
      <div class="message">
        <p>Please reset password by clicking the link below:</p>
        <a href="{{ activation_url }}" class="cta-button">Reset Password</a>
        <p>
          This link will expire in 1 hour. If you did not request this, please
          change your password.
        </p>
      </div>
      <div class="footer">
        <p>Regards,</p>
        <p>USCHe</p>
      </div>
    </div>
  </body>
</html>
